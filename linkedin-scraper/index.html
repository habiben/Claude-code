<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Scraper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .container { max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 44px; }
    .section { margin-bottom: 28px; }
    .label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 10px; }
    .base-keywords { display: flex; flex-wrap: wrap; gap: 8px; }
    .base-kw { background: #141414; border: 1px solid #2a2a2a; color: #888; padding: 5px 13px; border-radius: 20px; font-size: 0.82rem; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 10px 12px; min-height: 52px; cursor: text; transition: border-color 0.15s; }
    .chip-wrap:focus-within { border-color: #0a66c2; }
    .chip { display: inline-flex; align-items: center; gap: 5px; background: #0a66c2; color: #fff; padding: 4px 11px; border-radius: 16px; font-size: 0.83rem; font-weight: 500; }
    .chip-x { cursor: pointer; opacity: 0.7; font-size: 1.1rem; line-height: 1; padding: 0 2px; border: none; background: none; color: inherit; }
    .chip-x:hover { opacity: 1; }
    .chip-input { background: transparent; border: none; outline: none; color: #e5e5e5; font-size: 0.9rem; min-width: 200px; flex: 1; }
    .chip-hint { font-size: 0.78rem; color: #444; margin-top: 7px; }
    .run-btn { background: #0a66c2; color: #fff; border: none; padding: 13px 30px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
    .run-btn:hover:not(:disabled) { background: #0857a8; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .progress { display: none; background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 10px; padding: 18px 20px; margin-top: 28px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; line-height: 1.7; max-height: 260px; overflow-y: auto; }
    .progress.show { display: block; }
    .log-line { color: #555; }
    .log-line.kw    { color: #5aabff; }
    .log-line.ok    { color: #4caf7d; }
    .log-line.post  { color: #ccc; }
    .log-line.err   { color: #e05; }
    .log-line.extra { color: #f5a623; }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; margin: 32px 0 24px; }
    .stat { flex: 1; min-width: 110px; background: #111; border: 1px solid #1e1e1e; border-radius: 10px; padding: 16px 20px; text-align: center; }
    .stat-n { font-size: 2rem; font-weight: 700; color: #0a66c2; line-height: 1; }
    .stat-l { font-size: 0.75rem; color: #555; margin-top: 5px; }
    .posts { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #111; border: 1px solid #1e1e1e; border-radius: 12px; padding: 20px; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .card-author { font-weight: 600; font-size: 0.93rem; }
    .card-kw { font-size: 0.72rem; background: #1a1a1a; border: 1px solid #2a2a2a; color: #666; padding: 3px 10px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
    .card-kw.extra { color: #f5a623; background: #f5a62310; border-color: #f5a62330; }
    .card-text { color: #bbb; font-size: 0.88rem; line-height: 1.65; margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
    .card-text.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .expand-btn { background: none; border: none; color: #0a66c2; cursor: pointer; font-size: 0.8rem; padding: 0; margin-bottom: 12px; display: block; }
    .card-meta { display: flex; gap: 14px; font-size: 0.8rem; color: #555; margin-bottom: 12px; }
    .agencies { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .agency { background: #0d1f0d; border: 1px solid #1a3a1a; color: #4caf7d; padding: 3px 10px; border-radius: 10px; font-size: 0.76rem; }
    .toggle-comments { background: none; border: 1px solid #2a2a2a; color: #666; cursor: pointer; font-size: 0.8rem; padding: 6px 14px; border-radius: 6px; transition: border-color 0.15s, color 0.15s; }
    .toggle-comments:hover { border-color: #444; color: #bbb; }
    .comments { display: none; flex-direction: column; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #1a1a1a; }
    .comment { background: #0d0d0d; border-radius: 8px; padding: 10px 14px; }
    .comment-author { font-size: 0.8rem; font-weight: 600; color: #888; margin-bottom: 4px; }
    .comment-text { font-size: 0.84rem; color: #aaa; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .card-link { display: inline-block; margin-top: 14px; color: #0a66c2; font-size: 0.8rem; text-decoration: none; }
    .card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">
  <h1>LinkedIn Scraper</h1>
  <p class="subtitle">Hämtar inlägg och kommentarer från LinkedIn</p>

  <div class="section">
    <span class="label">Bassöktermer — alltid aktiva</span>
    <div class="base-keywords" id="baseKws"></div>
  </div>

  <div class="section">
    <span class="label">Extra söktermer — tillfälliga</span>
    <div class="chip-wrap" id="chipWrap">
      <input id="chipIn" class="chip-input" placeholder="Skriv en term och tryck Enter..." autocomplete="off">
    </div>
    <div class="chip-hint">Tryck <strong>Enter</strong> för att lägga till &nbsp;·&nbsp; klicka × för att ta bort</div>
  </div>

  <button class="run-btn" id="runBtn" onclick="start()">Kör sökning</button>

  <div class="progress" id="log"></div>
  <div id="results"></div>
</div>

<script>
  let extras = [];
  let posts  = [];

  fetch('/config').then(r => r.json()).then(({ baseKeywords }) => {
    const wrap = document.getElementById('baseKws');
    baseKeywords.forEach(kw => {
      const s = document.createElement('span');
      s.className = 'base-kw';
      s.textContent = kw;
      wrap.appendChild(s);
    });
  });

  const chipIn = document.getElementById('chipIn');
  const chipWrap = document.getElementById('chipWrap');

  chipWrap.addEventListener('click', () => chipIn.focus());

  chipIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = chipIn.value.trim();
      if (val) { addChip(val); chipIn.value = ''; }
    }
    if (e.key === 'Backspace' && chipIn.value === '' && extras.length > 0) {
      removeChip(extras[extras.length - 1]);
    }
  });

  // Also support comma as separator
  chipIn.addEventListener('input', e => {
    if (chipIn.value.endsWith(',')) {
      const val = chipIn.value.slice(0, -1).trim();
      if (val) { addChip(val); chipIn.value = ''; }
    }
  });

  function addChip(term) {
    if (!term || extras.includes(term)) return;
    extras.push(term);
    renderChips();
  }

  function removeChip(term) {
    extras = extras.filter(k => k !== term);
    renderChips();
  }

  function renderChips() {
    chipWrap.querySelectorAll('.chip').forEach(c => c.remove());
    extras.forEach(term => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createTextNode(term + ' ');
      const btn   = document.createElement('button');
      btn.className = 'chip-x';
      btn.textContent = '×';
      btn.type = 'button';
      btn.addEventListener('click', (e) => { e.stopPropagation(); removeChip(term); });
      chip.appendChild(label);
      chip.appendChild(btn);
      chipWrap.insertBefore(chip, chipIn);
    });
  }

  function x(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function start() {
    const btn = document.getElementById('runBtn');
    const log = document.getElementById('log');
    const res = document.getElementById('results');
    btn.disabled = true; btn.textContent = 'Söker…';
    log.innerHTML = ''; log.className = 'progress show';
    res.innerHTML = ''; posts = [];

    try {
      const r = await fetch('/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ extraKeywords: extras })
      });
      if (!r.ok) { const e = await r.json(); addLog('FEL: ' + e.error, 'err'); done(btn); return; }
      const { jobId } = await r.json();

      const es = new EventSource('/stream/' + jobId);
      es.addEventListener('searching', e => {
        const d = JSON.parse(e.data);
        addLog('Söker: "' + d.keyword + '"' + (d.isExtra ? ' [extra]' : ''), d.isExtra ? 'extra' : 'kw');
      });
      es.addEventListener('found', e => {
        const d = JSON.parse(e.data);
        addLog('  → ' + d.count + ' nya inlägg', 'ok');
      });
      es.addEventListener('post', e => {
        const p = JSON.parse(e.data);
        posts.push(p);
        addLog('  ✓ ' + p.author.substring(0,40) + '  👍 ' + p.likes + '  💬 ' + p.comments, 'post');
        renderResults();
      });
      es.addEventListener('error_msg', e => {
        const d = JSON.parse(e.data);
        addLog('  ✗ ' + (d.keyword ? d.keyword + ': ' : '') + d.message, 'err');
      });
      es.addEventListener('done', e => {
        const d = JSON.parse(e.data);
        addLog('Klart! ' + d.totalPosts + ' inlägg hämtade.', 'ok');
        es.close(); done(btn);
      });
      es.onerror = () => { es.close(); done(btn); };
    } catch (err) {
      addLog('FEL: ' + err.message, 'err'); done(btn);
    }
  }

  function done(btn) { btn.disabled = false; btn.textContent = 'Kör sökning'; }

  function addLog(text, cls) {
    const log = document.getElementById('log');
    const d = document.createElement('div');
    d.className = 'log-line ' + (cls || '');
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function renderResults() {
    const withC = posts.filter(p => p.commentsList?.length).length;
    const withA = posts.filter(p => p.mentionedAgencies?.length).length;
    document.getElementById('results').innerHTML = `
      <div class="stats">
        <div class="stat"><div class="stat-n">${posts.length}</div><div class="stat-l">Inlägg</div></div>
        <div class="stat"><div class="stat-n">${withC}</div><div class="stat-l">Med kommentarer</div></div>
        <div class="stat"><div class="stat-n">${withA}</div><div class="stat-l">Nämnanden</div></div>
      </div>
      <div class="posts">${posts.map((p,i) => card(p,i)).join('')}</div>`;
  }

  function card(p, i) {
    const agencies = (p.mentionedAgencies||[]).map(a => `<span class="agency">${x(a)}</span>`).join('');
    const comments = (p.commentsList||[]).map(c =>
      `<div class="comment"><div class="comment-author">${x(c.author)}</div><div class="comment-text">${x(c.text)}</div></div>`
    ).join('');
    const long = p.text.length > 220;
    return `
      <div class="card">
        <div class="card-head">
          <span class="card-author">${x(p.author)}</span>
          <span class="card-kw${p.isExtra?' extra':''}">${x(p.matchedKeyword)}</span>
        </div>
        <div class="card-text${long?' collapsed':''}" id="ct${i}">${x(p.text)}</div>
        ${long?`<button class="expand-btn" onclick="expand(${i})">Visa mer</button>`:''}
        <div class="card-meta"><span>👍 ${p.likes}</span><span>💬 ${p.comments}</span><span>🔄 ${p.shares}</span></div>
        ${agencies?`<div class="agencies">${agencies}</div>`:''}
        ${comments?`<button class="toggle-comments" onclick="toggleC(${i})">Visa kommentarer (${p.commentsList.length})</button><div class="comments" id="cm${i}">${comments}</div>`:''}
        <a href="${x(p.url)}" class="card-link" target="_blank" rel="noopener">Öppna på LinkedIn ↗</a>
      </div>`;
  }

  function expand(i) {
    const el = document.getElementById('ct'+i);
    const btn = el.nextElementSibling;
    if (btn && btn.classList.contains('expand-btn')) {
      el.classList.toggle('collapsed');
      btn.textContent = el.classList.contains('collapsed') ? 'Visa mer' : 'Visa mindre';
    }
  }

  function toggleC(i) {
    const el = document.getElementById('cm'+i);
    el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
    el.style.flexDirection = 'column';
  }
</script>
</body>
</html>
